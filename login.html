<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthyNutrition | Login</title>

    <link rel="stylesheet" href="cslo.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>

<body>

<!-- Background -->
<div class="background">

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

</div>

<!-- Navigation -->
<header>

    <nav class="navbar">

        <div class="logo">

            <div class="logo-icon">
                <img src="nt.png" alt="HealthyNutrition Logo">
            </div>

            <h2>HealthyNutrition</h2>

        </div>

        <ul>
            <li>
                <a href="index.html">Home</a>
            </li>
        </ul>

    </nav>

</header>

<!-- Login Section -->
<section class="login-section">

    <!-- Left Side -->
    <div class="left-content">

        <div class="badge">

            <i class="fa-brands fa-pagelines"
               style="color: rgb(253, 0, 0);">
            </i>

            &nbsp;

            Personalized Health Platform

        </div>

        <h1>
            Eat Better.
            <br>
            <span>Live Better.</span>
        </h1>

        <p>
            Start your personalized nutrition journey with expert
            dietitians.
        </p>

    </div>

    <!-- Right Side -->
    <div class="login-card">

        <h2>Welcome Back</h2>

        <p>
            Login to continue your healthy journey.
        </p>

        <form>

            <!-- Email -->
            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required>

            </div>

          <div class="input-group">

    <label>Password</label>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required>

        <i
            class="fa-regular fa-eye"
            id="togglePassword">
        </i>

    </div>

</div>

            <!-- Remember / Forgot -->
            <div class="row">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>

            <!-- Login Button -->
            <button type="submit" class="login-btn">
                Login
            </button>

            <!-- Divider -->
            <div class="divider">

                <span>OR</span>

            </div>

            <!-- Google Button -->
            <button
                type="button"
                class="google-btn">

                <img
                    src="https://www.svgrepo.com/show/475656/google-color.svg"
                    width="22"
                    alt="Google">

                Continue with Google

            </button>

            <!-- Create Account -->
            <p class="signup">

                Don't have an account?

                <a href="createacct.html">
                    Create Account
                </a>

            </p>

        </form>

    </div>

</section>

<!-- JavaScript -->
<script src="loginJs.js"></script>

</body>
</html>
