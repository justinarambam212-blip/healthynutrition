<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="forgetPass.css">

</head>

<body>

    <!-- Decorative background -->

    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>
    <div class="shape shape-three"></div>

    <div class="heart heart-one">♡</div>
    <div class="heart heart-two">♡</div>
    <div class="heart heart-three">♡</div>


    <!-- Forgot Password Card -->

    <main class="forgot-card">

        <!-- Lock Icon -->

        <div class="lock-circle">

            <i class="fa-solid fa-lock"></i>

            <span class="sparkle">✦</span>

        </div>


        <!-- Heading -->

        <h1>Forgot Password?</h1>

        <p class="description">
            Don't worry, it happens! Enter your email
            and we'll send you a little reset link.
        </p>


        <!-- Form -->

        <form id="forgotPasswordForm">

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                </div>

            </div>


            <!-- Button -->

            <button
                type="submit"
                class="reset-btn">

                <i class="fa-regular fa-paper-plane"></i>

                Send Reset Link

            </button>

        </form>


        <!-- Divider -->

        <div class="divider">

            <span>♡</span>

        </div>


        <!-- Back -->

        <a
            href="login.html"
            class="back-login">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Login

        </a>

    </main>

    <script src="forget.js"></script>

</body>

</html>
